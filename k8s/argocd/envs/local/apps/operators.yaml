apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/Baeinsoo/infrastructure
    targetRevision: main
    path: k8s/base/operators
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CNPG CRD는 client-side apply가 쓰는 주석(last-applied-configuration) 크기 한도를 넘는다 → server-side apply로 적용
      - CreateNamespace=true
      - ServerSideApply=true
