# 로컬 개발용 kind 클러스터 정의.
#
# 왜 필요한가: Docker Desktop 내장 쿠버네티스는 관리형이라 "노드의 어떤 포트를 내 PC로 열지"를
# 지정할 수 없다. 그래서 게임 룸(hostPort)에 클라가 접속할 수 없었다 — 노드가 내 PC가 아니라
# Docker Desktop이 관리하는 숨은 컨테이너이고, 호스트로 공개된 포트가 6443 하나뿐이었기 때문이다.
# (같은 ingress를 LoadBalancer로는 localhost:80에서 200, NodePort로는 localhost:31000에서 실패로 실측.)
#
# 사용:
#   1) Docker Desktop 설정에서 Kubernetes 끄기 (포트/이름 충돌 방지)
#   2) kind create cluster --name lop --config k8s/local-k8s/kind-cluster.yaml
#   3) ArgoCD 부트스트랩 — k8s/argocd/README.md 절차 그대로
#
# 주의: extraPortMappings에는 포트 범위 문법이 없어 한 줄씩 나열해야 한다. 룸 포트를 늘리려면
# 여기에 줄을 추가하고 room-server의 ROOM_PORT_MAX도 함께 올려야 한다(두 곳이 어긋나면
# 범위 밖 포트를 배정받아 "매칭은 되는데 접속만 안 되는" 증상이 재발한다).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lop
nodes:
  - role: control-plane
    # ingress-nginx의 kind용 배치를 쓰려면 이 라벨이 필요하다(nodeSelector가 이걸 본다).
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP/HTTPS — 기존 ingress-nginx-controller-nodeport(31000/32000)로 넘긴다.
      # 이렇게 하면 클라가 쓰는 http://localhost/lobby 가 그대로 동작하므로 ingress 매니페스트를
      # 고칠 필요가 없다. (자체 kind 클러스터에는 LoadBalancer 공급자가 없어 LoadBalancer 서비스는
      # <pending>으로 남는데, NodePort 변형이 이미 있어 그쪽을 쓰면 된다.)
      - { containerPort: 31000, hostPort: 80, protocol: TCP }
      - { containerPort: 32000, hostPort: 443, protocol: TCP }

      # 게임 룸 포트 풀 — room-server의 ROOM_PORT_MIN..ROOM_PORT_MAX와 반드시 일치해야 한다.
      # 파드 hostPort → 노드 포트 → 여기 매핑 → 내 PC 로, 세 단계가 같은 번호로 이어진다.
      - { containerPort: 7000, hostPort: 7000, protocol: UDP }
      - { containerPort: 7001, hostPort: 7001, protocol: UDP }
      - { containerPort: 7002, hostPort: 7002, protocol: UDP }
      - { containerPort: 7003, hostPort: 7003, protocol: UDP }
      - { containerPort: 7004, hostPort: 7004, protocol: UDP }
      - { containerPort: 7005, hostPort: 7005, protocol: UDP }
      - { containerPort: 7006, hostPort: 7006, protocol: UDP }
      - { containerPort: 7007, hostPort: 7007, protocol: UDP }
      - { containerPort: 7008, hostPort: 7008, protocol: UDP }
      - { containerPort: 7009, hostPort: 7009, protocol: UDP }
