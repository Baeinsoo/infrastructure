apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../../base/platform
  - backup-creds-secret.yaml
patches:
  - path: cluster-patch.yaml
    target:
      kind: Cluster
      name: lop-db
  - path: objectstore-patch.yaml
    target:
      kind: ObjectStore
      name: lop-db-backup
