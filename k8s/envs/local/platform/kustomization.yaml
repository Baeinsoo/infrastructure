apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- ../../../base/platform
- ../../../base/platform/postgres-cnpg
- backup-creds-secret.yaml
patches:
- path: cluster-patch.yaml
  target:
    kind: Cluster
    name: lop-db
- path: objectstore-patch.yaml
  target:
    kind: ObjectStore
    name: lop-db-backup
- path: patches/delete-old-postgres-deployment.yaml
- path: patches/delete-old-postgres-service.yaml
- path: patches/delete-old-postgres-secret.yaml
