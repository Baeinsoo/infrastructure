apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lop-db
spec:
  instances: 1 # 오버레이가 덮는다
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6 # 옛 DB가 17.2 — 같은 메이저여야 import 뒤 호환
  storage:
    size: 2Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: lop
      owner: lop_migrator
      secret:
        name: lop-db-migrator
      # lop_migrator가 lop_app에 ALTER ROLE ... SET(타임아웃 등)을 걸려면 lop_app의 멤버여야 한다
      # (PG16+ 규칙 — CREATEROLE만으론 부족하고, 자신이 만들지 않은 롤을 바꾸려면 ADMIN OPTION으로
      # 그 롤에 속해 있어야 함). 이 SQL은 initdb 부트스트랩 중 postgres superuser로 돈다 — 그런데
      # managed.roles(아래)의 lop_app 생성은 **별도의, 이후에 도는 리컨실 루프**라 이 시점엔 lop_app이
      # 아직 없을 수 있다(CNPG 문서가 이 둘의 선후를 명시하지 않음 — 확인 못 함). 그래서 먼저 빈 롤로
      # 만들어 두면(이미 있어도 안전) 리컨실 루프가 나중에 ALTER ROLE로 login/password를 채운다.
      # Task 4가 db-migrate Job에서 배포 전 pg_create_restore_point()를 부른다 — 이 함수는
      # PostgreSQL 기본값이 superuser 전용이라, enableSuperuserAccess:false인 이 클러스터에서
      # lop_migrator(비-superuser)가 그냥 부르면 권한 에러로 실패한다(Job 쪽은 실패해도 경고만
      # 남기고 계속 진행하게 짜여 있지만, 그러면 복원점이 매번 조용히 안 생긴다). 그래서 EXECUTE를
      # 명시적으로 내려준다.
      postInitApplicationSQL:
        # 부트스트랩 시점엔 lop_app이 없다(initdb는 빈 클러스터, import는 롤을 안 가져온다). DO $$…$$ 블록은
        # CNPG가 이 SQL을 실행하는 방식에서 "syntax error at or near $"로 깨진다(10-12 실측) → 조건 없이 만든다.
        - "CREATE ROLE lop_app LOGIN"
        - "GRANT lop_app TO lop_migrator WITH ADMIN OPTION"
        - "GRANT EXECUTE ON FUNCTION pg_create_restore_point(text) TO lop_migrator"
      # import 블록은 전환(Task 5) 때 오버레이 패치로 붙이고, 끝나면 뗀다 — 두 번째 생성부터는 recovery/initdb가 아니라 기존 PVC.
      # import 경로에서도 postInitApplicationSQL은 돈다(10-12 실측: import 파드 로그 "init Application queries").
      # 그래서 postImportApplicationSQL에는 CREATE ROLE을 다시 넣지 않는다(두 번째 생성은 "already exists"로 깨짐).
  managed:
    roles:
      - name: lop_migrator
        ensure: present
        login: true
        superuser: false
        createrole: true # lop_app에 ALTER ROLE ... SET(타임아웃 등)을 걸려면 CREATEROLE + lop_app의 ADMIN OPTION 멤버십이 필요
        # CNPG의 managed.roles 리컨실은 spec에 적힌 inRoles를 "이 롤이 멤버여야 할 목록의 전부"로 보고,
        # 비어 있으면 DB에 실제로 걸려 있는 멤버십을 전부 REVOKE한다 — postInitApplicationSQL에서 준
        # "lop_app WITH ADMIN OPTION" 멤버십이 리컨실 한 번에 날아간다. 그래서 여기에도 똑같이 적어야
        # 유지된다(단 이 필드로는 ADMIN OPTION 여부를 지정할 수 없다 — 이미 ADMIN OPTION으로 걸려 있는
        # 멤버십을 "그대로 유지"만 한다. ADMIN OPTION 자체는 postInitApplicationSQL의 GRANT가 준다).
        inRoles:
          - lop_app
        passwordSecret:
          name: lop-db-migrator
        comment: "마이그레이션 전용 — 앱 DB 소유자"
      - name: lop_app
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: lop-db-app-user
        comment: "앱 전용 — 원장 UPDATE/DELETE 불가"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: lop-db-backup
  postgresql:
    parameters:
      archive_timeout: "300s" # 쓰기가 적어도 5분마다 WAL을 닫아 보낸다 → RPO ≤ 5분
