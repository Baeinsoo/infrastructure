apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: lop-db-backup
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://lop-db-backup/
    endpointURL: http://REPLACED-BY-OVERLAY:9000
    s3Credentials:
      accessKeyId:
        name: lop-db-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: lop-db-backup-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
