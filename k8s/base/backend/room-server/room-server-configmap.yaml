apiVersion: v1
kind: ConfigMap
metadata:
  name: room-server-config
data:
  NODE_ENV: "development"
  SPECIFIC_ENV: "local-k8s"
  # 게임 룸이 노드에 열 hostPort 범위(Agones의 gameservers.minPort/maxPort에 대응).
  # 이 범위는 노드에서 실제로 열려 있어야 한다 — 로컬은 k8s/local-k8s/kind-cluster.yaml의
  # extraPortMappings, dev는 방화벽. 세 곳 중 하나만 늘리면 범위 밖 포트를 배정받아
  # "매칭은 되는데 접속만 안 되는" 증상이 된다.
  # 로컬은 kind가 포트를 한 줄씩 나열해야 해서 10개, dev/prod는 방화벽 한 줄이라 넓게 잡는다.
  ROOM_PORT_MIN: "7000"
  ROOM_PORT_MAX: "7009"