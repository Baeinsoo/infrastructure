apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-server
  template:
    metadata:
      labels:
        app: lobby-server
    spec:
      containers:
      - name: lobby-server
        image: re5nardo/lobby-server:latest
        ports:
        - containerPort: 80
        env:
        - name: POSTGRES_HOST
          value: lop-db-rw
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DATABASE
          value: lop
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: lop-db-app-user
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lop-db-app-user
              key: password
        envFrom:
        - configMapRef:
            name: lobby-server-config
        - secretRef:
            name: auth-secret
        - secretRef:
            name: internal-api-secret