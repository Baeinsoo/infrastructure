name: infra-ci
on: { pull_request: { paths: ['k8s/**'] }, push: { branches: [main], paths: ['k8s/**'] } }
jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build (모든 오버레이)
        run: |
          set -e
          for d in k8s/base/operators k8s/envs/local/platform k8s/envs/dev/platform k8s/envs/local/backend k8s/envs/dev/backend; do
            echo "== $d"; kubectl kustomize "$d" > /tmp/out.yaml
          done
      - name: Cluster에 plugins·managed.roles가 있는지
        run: |
          kubectl kustomize k8s/envs/local/platform | yq 'select(.kind=="Cluster") | .spec.plugins[0].name' | grep -q barman-cloud
          kubectl kustomize k8s/envs/local/platform | yq 'select(.kind=="Cluster") | .spec.managed.roles[].name' | grep -q lop_app
      - name: 백엔드 워크로드가 옛 postgres-service 대신 lop-db-rw를 보는지
        run: |
          set -e
          # lop-db-rw 참조 7곳 — lobby-server/matchmaking-server/matchmaking-director/room-server
          # Deployment의 POSTGRES_HOST(4) + reconcile CronJob의 POSTGRES_HOST(1)
          # + db-migrate Job의 DATABASE_URL(1) + wait-for-postgres initContainer의 nc 대상(1).
          count=$(kubectl kustomize k8s/envs/local/backend | grep -o "lop-db-rw" | wc -l)
          [ "$count" -eq 7 ] || { echo "lop-db-rw 참조 개수가 7이 아님: $count"; exit 1; }
          kubectl kustomize k8s/envs/local/backend | grep -c "name: postgres-secret" | grep -qx 0
